<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מקלדת אוטוקאד - מעברית לאנגלית</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom Scrollbar Styling */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent; 
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Dark scrollbar for English panel */
        #english-output::-webkit-scrollbar-thumb {
            background: #475569;
        }
        #english-output::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-gray-100 text-slate-800 min-h-screen flex flex-col items-center py-10 px-4 md:px-8 font-sans">

    <div class="max-w-6xl w-full flex-grow flex flex-col gap-8">
        <header class="text-center space-y-3">
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-slate-900 drop-shadow-sm">
                מקלדת אוטוקאד - מעברית לאנגלית
            </h1>
            <p class="text-slate-500 max-w-lg mx-auto text-lg">
                המרת טקסט לאנגלית וסידור העיצוב בזמן אמת
            </p>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full h-full">
            
            <div class="flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative min-h-[400px]">
                <div class="bg-white px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                    <span class="font-semibold text-slate-800 text-lg flex items-center gap-2">
                        <!-- RTL Direction Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600">
                            <path d="M21 9H7a4 4 0 1 0 0 8h14"></path>
                            <path d="M18 5l3 4-3 4"></path>
                        </svg>
                        טקסט בעברית
                    </span>
                </div>
                <div class="p-5 flex-grow flex flex-col relative">
                    <textarea 
                        id="hebrew-input" 
                        class="w-full h-72 md:h-full pb-20 outline-none resize-none text-xl leading-relaxed text-slate-800 placeholder-slate-300 bg-transparent"
                        dir="rtl"
                        placeholder="פתח שחרור עשן"
                        autofocus></textarea>
                        
                    <div class="absolute bottom-5 left-5">
                        <button 
                            id="clear-btn"
                            class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl shadow-sm transition-all active:scale-95 font-medium border border-blue-700">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"></path>
                                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                            </svg>
                            <span>ניקוי</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col bg-slate-900 rounded-2xl shadow-md border border-slate-800 overflow-hidden relative group min-h-[400px]">
                <div class="bg-slate-950 px-5 py-4 border-b border-slate-800">
                    <span class="font-semibold text-slate-100 text-lg flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-400">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        אנגלית לאוטוקאד
                    </span>
                </div>
                <div class="p-5 flex-grow flex flex-col relative">
                    <!-- LTR text area ensures correct English keyboard rendering. Dark theme text colors used. -->
                    <textarea 
                        id="english-output" 
                        class="w-full h-72 md:h-full pb-20 outline-none resize-none text-xl leading-relaxed text-slate-200 placeholder-slate-600 bg-transparent text-left font-mono"
                        dir="ltr"
                        placeholder="English output will appear here..."
                        readonly></textarea>
                        
                    <div class="absolute bottom-5 left-5" dir="ltr">
                        <button 
                            id="copy-btn"
                            class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl shadow-md transition-all active:scale-95 font-medium disabled:opacity-50 disabled:cursor-not-allowed border border-indigo-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            <span dir="rtl">העתק</span>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 opacity-0 pointer-events-none transition-all duration-300 translate-y-4 z-50">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span class="font-medium tracking-wide">הטקסט הועתק ללוח!</span>
    </div>

    <script>
        // Mapping Hebrew keys directly to their physical QWERTY English counterparts
        const hebToEngMap = {
            '/': 'q', '\'': 'w', 'ק': 'e', 'ר': 'r', 'א': 't', 'ט': 'y', 'ו': 'u', 'ן': 'i', 'ם': 'o', 'פ': 'p', ']': '[', '[': ']',
            'ש': 'a', 'ד': 's', 'ג': 'd', 'כ': 'f', 'ע': 'g', 'י': 'h', 'ח': 'j', 'ל': 'k', 'ך': 'l', 'ף': ';', ',': '\'',
            'ז': 'z', 'ס': 'x', 'ב': 'c', 'ה': 'v', 'נ': 'b', 'מ': 'n', 'צ': 'm', 'ת': ',', 'ץ': '.', '.': '/'
        };

        const hebrewInput = document.getElementById('hebrew-input');
        const englishOutput = document.getElementById('english-output');
        const copyBtn = document.getElementById('copy-btn');
        const toast = document.getElementById('toast');
        const clearBtn = document.getElementById('clear-btn');
        let toastTimeout;
        
        copyBtn.setAttribute('disabled', 'true');

        // Clear functionality
        clearBtn.addEventListener('click', () => {
            hebrewInput.value = '';
            englishOutput.value = '';
            copyBtn.setAttribute('disabled', 'true');
            hebrewInput.focus();
        });

        // Conversion functionality
        function convertText(text) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (hebToEngMap[char] !== undefined) {
                    result += hebToEngMap[char];
                } else {
                    result += char;
                }
            }
            return result;
        }

        // Formatting rules logic
        function formatHebrewText(text) {
            return text
                // 1. Line numbering logic (e.g. " .4" or ".4" or " 4." -> "4. ")
                // This strips leading spaces automatically by grabbing them in p1 but ignoring them in the output.
                .replace(/(^|\n)[ \t]*(?:\.([0-9]+)|([0-9]+)\.)[ \t]*/g, (match, p1, p2, p3) => {
                    const num = p2 || p3; 
                    return p1 + num + '. ';
                })
                // 2. Insert space between a letter and a number
                .replace(/([א-תa-zA-Z])([0-9])/g, '$1 $2')
                // 3. Insert space between a number and a letter
                .replace(/([0-9])([א-תa-zA-Z])/g, '$1 $2')
                // 4. Collapse multiple spaces into a single space (ignoring newlines)
                .replace(/ {2,}/g, ' '); 
        }

        // Handle text input, cursor position, and conditional formatting
        hebrewInput.addEventListener('input', (e) => {
            const rawText = e.target.value;
            const selectionStart = e.target.selectionStart;
            
            // CRITICAL: Check if the user is performing a deletion operation (Backspace/Delete).
            // If they are deleting, we DO NOT auto-format, allowing them to freely remove spaces/numbers.
            const isDeleting = e.inputType && e.inputType.startsWith('delete');

            if (!isDeleting) {
                // Calculate position based only on text before cursor so cursor doesn't jump
                const textBeforeCursor = rawText.substring(0, selectionStart);
                const formattedTextBeforeCursor = formatHebrewText(textBeforeCursor);
                const newCursorPos = formattedTextBeforeCursor.length;

                const formattedText = formatHebrewText(rawText);
                
                if (rawText !== formattedText) {
                    e.target.value = formattedText;
                    e.target.setSelectionRange(newCursorPos, newCursorPos);
                }
            }

            // Convert and populate output (happens always, even on delete)
            const convertedText = convertText(e.target.value);
            englishOutput.value = convertedText;
            
            if(convertedText.trim().length > 0) {
                copyBtn.removeAttribute('disabled');
            } else {
                copyBtn.setAttribute('disabled', 'true');
            }
        });

        // Copy functionality logic
        function showToast() {
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2500);
        }

        copyBtn.addEventListener('click', async () => {
            const textToCopy = englishOutput.value;
            if (!textToCopy) return;

            try {
                await navigator.clipboard.writeText(textToCopy);
                showToast();
            } catch (err) {
                // Fallback for older browsers or restricted iframe environments
                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (e) {
                    console.error('Failed to copy text', e);
                } finally {
                    document.body.removeChild(textarea);
                }
            }
        });
    </script>
</body>
</html>
